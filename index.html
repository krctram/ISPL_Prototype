<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNCSC Tender Supply Tracker — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#2E3E62;
    --paper:#F6F3EC; --card:#FFFFFF;
    --gold:#B98328; --gold-soft:#EFDDB2; --gold-pale:#FBF3E3;
    --slate:#5B6478;
    --rust:#B5503A; --rust-pale:#F5E2DC;
    --green:#3E7A54; --green-pale:#DEEAE1;
    --line:#E1DACA; --line-strong:#CBC0A2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Public Sans",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:"Fraunces",serif;margin:0;font-weight:600;color:var(--ink);}
  .mono{font-family:"IBM Plex Mono",monospace;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;}
  .grain{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.035;mix-blend-mode:multiply;background-image:radial-gradient(circle at 1px 1px, #000 1px, transparent 0);background-size:3px 3px;}

  header.top{position:sticky;top:0;z-index:50;background:var(--ink);color:#EFE9DA;padding:16px 28px;box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand .mark{width:38px;height:38px;border-radius:8px;background:linear-gradient(155deg,var(--gold) 0%, #8f6318 100%);display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:700;color:#1B2A4A;font-size:17px;flex:none;}
  .brand .name{font-family:"Fraunces",serif;font-size:19px;font-weight:600;color:#fff;}
  .brand .sub{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#C7BFA8;}
  .back-btn{display:flex;align-items:center;gap:8px;color:#E7E1D2;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:7px;}
  .back-btn:hover{background:rgba(255,255,255,.13);}
  .top-actions{display:flex;gap:10px;align-items:center;}
  .btn-gold{background:var(--gold);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:13.5px;font-weight:600;}
  .btn-gold:hover{background:#a3771f;}

  main{max-width:1200px;margin:0 auto;padding:26px 28px 80px;flex:1;min-width:0;}

  /* -------- app shell / left nav -------- */
  .app-body{display:flex;align-items:flex-start;}
  .side-nav{width:214px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:var(--header-h,72px);height:calc(100vh - var(--header-h,72px));overflow-y:auto;}
  .side-nav .nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:8px;font-size:13.8px;font-weight:600;color:var(--slate);cursor:pointer;margin-bottom:3px;transition:background .12s,color .12s;}
  .side-nav .nav-item .ic{font-size:16px;flex:none;width:18px;text-align:center;}
  .side-nav .nav-item:hover{background:var(--gold-pale);color:#8f6318;}
  .side-nav .nav-item.active{background:var(--ink);color:#fff;}
  .side-nav .nav-section-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--slate);font-weight:700;padding:10px 13px 6px;}

  @media (max-width:760px){
    .app-body{flex-direction:column;}
    .side-nav{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:10px 12px;gap:4px;}
    .side-nav .nav-section-lbl{display:none;}
    .side-nav .nav-item{margin-bottom:0;white-space:nowrap;}
    main{padding:20px 16px 60px;}
  }

  /* -------- analytics page -------- */
  .analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
  .kpi-tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .kpi-tile .kn{font-family:"Fraunces",serif;font-size:27px;font-weight:600;color:var(--ink);}
  .kpi-tile .kl{font-size:12px;color:var(--slate);margin-top:3px;}
  .kpi-tile .kd{font-size:11.5px;margin-top:6px;font-weight:600;}
  .kpi-tile .kd.up{color:var(--green);}
  .kpi-tile .kd.warn{color:var(--rust);}

  .chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin-bottom:16px;}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;}
  .chart-card h3{font-size:15.5px;margin-bottom:2px;}
  .chart-card .chart-sub{font-size:12px;color:var(--slate);margin-bottom:16px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .blbl{width:150px;flex:none;font-size:12.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:16px;border-radius:4px;background:var(--gold-pale);overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),#8f6318);border-radius:4px;}
  .bar-fill.green{background:linear-gradient(90deg,var(--green),#2d5f40);}
  .bar-fill.rust{background:linear-gradient(90deg,var(--rust),#8a3a29);}
  .bar-val{width:38px;flex:none;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate);}
  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;}
  .donut-legend .li{display:flex;align-items:center;gap:8px;font-size:12.8px;color:var(--ink);}
  .donut-legend .sw{width:10px;height:10px;border-radius:3px;flex:none;}

  /* -------- admin pages -------- */
  .admin-add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .admin-add-row input{padding:9px 12px;border:1px solid var(--line-strong);border-radius:7px;font-size:13px;font-family:inherit;}
  .admin-add-row input.aname{flex:1;min-width:200px;}
  .admin-add-row input.arole{flex:1;min-width:160px;}
  .admin-add-row button{border:1px dashed var(--gold);background:var(--gold-pale);color:#8f6318;font-size:13px;font-weight:600;padding:9px 14px;border-radius:7px;flex:none;}
  .admin-list{display:flex;flex-direction:column;gap:8px;}
  .admin-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:11px 14px;}
  .admin-row .aidx{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate);width:20px;flex:none;}
  .admin-row input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px;font-family:inherit;}
  .admin-row .order-btns{display:flex;flex-direction:column;gap:2px;flex:none;}
  .admin-row .order-btns button{border:1px solid var(--line-strong);background:#fff;color:var(--slate);width:22px;height:18px;line-height:1;font-size:10px;border-radius:4px;padding:0;}
  .admin-row .order-btns button:disabled{opacity:.3;}
  .admin-row .rm-admin{flex:none;border:1px solid var(--rust-pale);background:#fff;color:var(--rust);font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:6px;}
  .admin-note{font-size:12.5px;color:var(--slate);margin-bottom:16px;background:var(--gold-pale);border-radius:8px;padding:11px 14px;}

  /* -------- dashboard -------- */
  .dash-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:220px;position:relative;}
  .search-box input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line-strong);border-radius:8px;font-size:13.8px;background:var(--card);color:var(--ink);}
  .search-box input:focus{outline:none;border-color:var(--gold);}
  .search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--slate);font-size:14px;}
  .filter-chip{border:1px solid var(--line-strong);background:var(--card);color:var(--slate);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .stat-mini{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stat-mini .n{font-family:"Fraunces",serif;font-size:24px;font-weight:600;}
  .stat-mini .l{font-size:12px;color:var(--slate);margin-top:2px;}

  .tender-list{display:flex;flex-direction:column;gap:10px;}
  .tender-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:box-shadow .15s, border-color .15s;display:flex;flex-direction:column;gap:10px;}
  .tender-card:hover{box-shadow:0 3px 14px rgba(27,42,74,.08);border-color:var(--line-strong);}
  .tc-id{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--slate);}
  .tc-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .tc-title{font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .tc-meta{font-size:12.5px;color:var(--slate);display:flex;gap:14px;flex-wrap:wrap;}
  .tc-top-right{display:flex;align-items:center;gap:14px;flex:none;}
  .tc-stage-row{display:flex;align-items:center;gap:16px;}
  .tc-stage-info{flex:1;min-width:0;}
  .tc-stage-info .lbl{font-size:11.5px;color:var(--slate);margin-bottom:5px;}
  .tc-stage-info .name{font-size:13px;font-weight:600;color:var(--ink);}
  .tc-track{height:6px;border-radius:4px;background:var(--gold-pale);overflow:hidden;flex:1;min-width:120px;}
  .tc-fill{height:100%;background:linear-gradient(90deg,var(--gold),#8f6318);}
  .tc-pct{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate);flex:none;width:36px;text-align:right;}
  .chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:600;font-family:"IBM Plex Mono",monospace;flex:none;}
  .chip.green{background:var(--green-pale);color:var(--green);}
  .chip.gold{background:var(--gold-soft);color:#8f6318;}
  .chip.rust{background:var(--rust-pale);color:var(--rust);}
  .chip.slate{background:#EFEBE0;color:var(--slate);}
  .tc-arrow{color:var(--line-strong);font-size:20px;flex:none;}
  .tender-card:hover .tc-arrow{color:var(--gold);}

  /* add tender modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(27,42,74,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;padding:26px 28px;max-width:440px;width:100%;}
  .modal h3{font-size:19px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--slate);display:block;margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:7px;font-size:13.8px;font-family:inherit;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .btn-ghost{background:none;border:1px solid var(--line-strong);color:var(--ink);padding:9px 16px;border-radius:7px;font-size:13.5px;font-weight:600;}

  /* -------- tender detail -------- */
  .detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .detail-top h1{font-size:24px;}
  .detail-top .meta-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--slate);margin-top:6px;}
  .detail-top .meta-row b{color:var(--ink);}


  .progress-strip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
  .progress-strip .ptext{font-size:13.5px;color:var(--slate);}
  .progress-strip .ptext b{color:var(--ink);font-weight:600;}
  .progress-track{flex:1;min-width:160px;height:8px;border-radius:5px;background:var(--gold-pale);overflow:hidden;}
  .progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),#8f6318);transition:width .4s ease;}
  .progress-strip .pct{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);font-weight:600;}

  main.stage-content{min-width:0;}

  /* horizontal stage tab bar */
  .stage-tabbar{position:relative;margin-bottom:22px;}
  .stage-tabbar .track-line{position:absolute;top:19px;left:0;right:0;height:2px;background:var(--line-strong);z-index:0;}
  .stage-tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;position:relative;z-index:1;scrollbar-width:thin;}
  .stage-tabs::-webkit-scrollbar{height:6px;}
  .stage-tabs::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  .step{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px 10px;border-radius:8px;cursor:pointer;flex:none;width:132px;background:var(--paper);}
  .step .dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;border:2px solid var(--line-strong);color:var(--slate);background:var(--card);flex:none;}
  .step.done .dot{background:var(--green);border-color:var(--green);color:#fff;}
  .step.current .dot{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px var(--gold-soft);}
  .step.selected .dot{transform:scale(1.1);}
  .step .body{text-align:center;}
  .step .phase{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--ink);line-height:1.25;margin-bottom:6px;min-height:26px;display:flex;align-items:center;justify-content:center;}
  .step.current .phase{color:#8f6318;}
  .step.selected .phase{text-decoration:underline;text-decoration-color:var(--gold-soft);text-decoration-thickness:2px;}
  .step .status-tag{font-size:9.5px;display:inline-block;padding:1px 8px;border-radius:10px;font-family:"IBM Plex Mono",monospace;white-space:nowrap;}
  .step.done .status-tag{background:var(--green-pale);color:var(--green);}
  .step.current .status-tag{background:var(--gold-soft);color:#8f6318;}
  .step.pending .status-tag{background:#EFEBE0;color:var(--slate);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .detail-head .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:600;margin-bottom:6px;}
  .detail-head h2{font-size:25px;}
  .detail-desc{color:var(--slate);font-size:14.5px;max-width:640px;margin-top:8px;}
  .stage-status-pill{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;flex:none;font-family:"IBM Plex Mono",monospace;}
  .stage-status-pill.done{background:var(--green-pale);color:var(--green);}
  .stage-status-pill.current{background:var(--gold-soft);color:#8f6318;}
  .stage-status-pill.pending{background:#EFEBE0;color:var(--slate);}
  .note{margin-top:16px;border-left:3px solid var(--gold);background:var(--gold-pale);padding:11px 15px;border-radius:0 6px 6px 0;font-size:13.5px;color:#6b4c14;}
  .note.alert{border-left-color:var(--rust);background:var(--rust-pale);color:#7a3722;}

  .section-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;margin:22px 0 10px;}
  .checklist{display:flex;flex-direction:column;gap:9px;}
  .qa-list{display:flex;flex-direction:column;gap:14px;}
  .qa-item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#FDFCF9;}
  .qa-item.answered{background:var(--green-pale);border-color:#c4dccb;}
  .qa-label{font-size:14px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px;}
  .qa-input{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:9px 12px;font-family:inherit;font-size:13.8px;color:var(--ink);background:#fff;resize:vertical;margin-top:6px;}
  .qa-input:focus{outline:none;border-color:var(--gold);}
  .check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#FDFCF9;}
  .check-item input[type=checkbox]{width:18px;height:18px;margin-top:1px;accent-color:var(--green);flex:none;}
  .check-item .ci-text{font-size:14px;color:var(--ink);flex:1;}
  .check-item .ci-sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
  .check-item.checked{background:var(--green-pale);border-color:#c4dccb;}
  .check-item.checked .ci-text{color:var(--green);text-decoration:line-through;text-decoration-color:#9dc4ab;}

  .doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .doc-tile{border:1.5px dashed var(--line-strong);border-radius:8px;padding:16px 14px;text-align:center;background:#FDFCF9;}
  .doc-tile.uploaded{border-style:solid;border-color:#c4dccb;background:var(--green-pale);}
  .doc-tile .icon{font-size:22px;margin-bottom:6px;}
  .doc-tile .dname{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;}
  .doc-tile .dstatus{font-size:11.5px;color:var(--slate);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .doc-tile.uploaded .dstatus{color:var(--green);}
  .doc-btn-row{display:flex;gap:6px;}
  .cap-btn{border:1px solid var(--gold);background:var(--gold-pale);color:#8f6318;font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;flex:1;}
  .doc-tile.uploaded .cap-btn{border-color:#9dc4ab;background:#fff;color:var(--green);}
  .rm-btn{border:1px solid var(--rust-pale);background:#fff;color:var(--rust);font-size:12px;font-weight:600;padding:6px 9px;border-radius:6px;}

  .audit-trail{display:flex;gap:0;margin-top:6px;flex-wrap:wrap;}
  .audit-node{flex:1;min-width:130px;text-align:center;position:relative;padding:0 4px;}
  .audit-node .bubble{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line-strong);background:var(--card);color:var(--slate);font-size:15px;}
  .audit-node.pass .bubble{background:var(--green);border-color:var(--green);color:#fff;}
  .audit-node.active .bubble{background:var(--gold);border-color:var(--gold);color:#fff;}
  .audit-node .lbl{font-size:12px;font-weight:600;color:var(--ink);}
  .audit-node .sub{font-size:11px;color:var(--slate);margin-top:2px;}
  .audit-connector{position:absolute;top:20px;left:-50%;width:100%;height:2px;background:var(--line-strong);z-index:0;}
  .audit-node:first-child .audit-connector{display:none;}
  .audit-node.pass .audit-connector{background:var(--green);}
  .audit-flag-btn{margin-top:14px;font-size:12px;font-weight:600;color:var(--rust);background:#fff;border:1px solid var(--rust-pale);padding:6px 12px;border-radius:6px;}

  /* -------- truck registry (Supply, Dispatch & Delivery stage) -------- */
  .truck-summary-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .truck-summary-strip .pill{background:#FDFCF9;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--slate);}
  .truck-summary-strip .pill b{color:var(--ink);font-family:"IBM Plex Mono",monospace;}
  .add-truck-btn{border:1px dashed var(--gold);background:var(--gold-pale);color:#8f6318;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;width:100%;margin-bottom:14px;}
  .truck-list{display:flex;flex-direction:column;gap:10px;}
  .truck-card{border:1px solid var(--line);border-radius:8px;background:#FDFCF9;overflow:hidden;}
  .truck-card.complete{border-color:#c4dccb;}
  .truck-head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;}
  .truck-head .tid{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink);flex:none;}
  .truck-head .tprog{flex:1;font-size:12px;color:var(--slate);}

  /* -------- region-wise allocation (Supply, Dispatch & Delivery stage) -------- */

  .region-add-row input.rtons{width:110px;}

  .region-card.certified{border-color:#c4dccb;background:var(--green-pale);}

  .region-tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:10px;font-family:"IBM Plex Mono",monospace;flex:none;}

  .region-tons-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--slate);margin-bottom:8px;flex-wrap:wrap;}

  .region-cert-status{font-size:12px;color:var(--slate);}
  .cert-btn{border:1px solid var(--gold);background:var(--gold-pale);color:#8f6318;font-size:12px;font-weight:600;padding:7px 12px;border-radius:6px;}
  .cert-btn.recv{border-color:#9dc4ab;background:var(--green);color:#fff;}
  .rm-region{margin-left:auto;flex:none;border:1px solid var(--rust-pale);background:#fff;color:var(--rust);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:6px;}

  .truck-region-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .truck-region-row select, .truck-region-row input{padding:6px 9px;border:1px solid var(--line-strong);border-radius:6px;font-size:12px;font-family:inherit;}

  .pack-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);width:100%;}

  .lorry-details{margin-bottom:14px;}

  .lorry-route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 12px;}

  .variance-block{margin-top:12px;border:1px solid var(--line);border-radius:7px;padding:12px 14px;background:#fff;}

  .variance-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .variance-row select, .variance-row input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:12.5px;font-family:inherit;}
  .variance-row input.vqty{width:100px;}

  .variance-badge.shortage,.variance-badge.damage{background:var(--rust-pale);color:var(--rust);}
  .variance-badge.overage{background:var(--gold-soft);color:#8f6318;}

  /* -------- multi-bill billing & payment stage -------- */
  .bill-add-btn{border:1px dashed var(--gold);background:var(--gold-pale);color:#8f6318;font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;width:100%;margin-bottom:14px;}
  .bill-list{display:flex;flex-direction:column;gap:16px;}
  .bill-card{border:1px solid var(--line);border-radius:8px;background:#FDFCF9;padding:16px;}

  .bill-region-empty{font-size:12.5px;color:var(--slate);font-style:italic;}
  .bill-doc-row{margin:12px 0;}
  .bill-doc-tile{border:1.5px dashed var(--line-strong);border-radius:8px;padding:12px 14px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .bill-doc-tile.uploaded{border-style:solid;border-color:#c4dccb;background:var(--green-pale);}
  .bill-doc-tile .dname{font-size:13px;font-weight:600;color:var(--ink);}
  .bill-doc-tile .dstatus{font-size:12px;color:var(--slate);}
  .bill-doc-tile.uploaded .dstatus{color:var(--green);}
  .approval-panel{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff;}

  .approve-btn{border:1px solid var(--green);background:var(--green-pale);color:var(--green);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:7px;}

  .reject-btn{border:1px solid var(--rust);background:var(--rust-pale);color:var(--rust);font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:7px;}
  .reject-btn:hover{background:var(--rust);color:#fff;}
  .reject-form{margin-top:4px;}
  .reject-form label{font-size:11.5px;font-weight:600;color:var(--slate);display:block;margin-bottom:6px;}
  .reject-form textarea{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:9px 11px;font-family:inherit;font-size:12.8px;resize:vertical;margin-bottom:10px;}
  .approve-form{margin-top:4px;}
  .approve-form label{font-size:11.5px;font-weight:600;color:var(--slate);display:block;margin-bottom:6px;}
  .approve-form textarea{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:9px 11px;font-family:inherit;font-size:12.8px;resize:vertical;margin-bottom:10px;}
  .approval-log{margin-top:14px;border-left:3px solid var(--green);background:var(--green-pale);border-radius:0 6px 6px 0;padding:10px 14px;}
  .approval-log .glbl{color:var(--green);margin-bottom:6px;}
  .approval-log-item{font-size:12.5px;color:#2d5f40;margin-bottom:4px;}
  .approval-log-item:last-child{margin-bottom:0;}
  .alog-role{color:var(--slate);font-weight:400;}
  .bill-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .bill-head .bid{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink);}
  .bill-head .bperiod{font-size:12px;color:var(--slate);margin-top:2px;}
  .bill-head .bvalue{font-size:13.5px;font-weight:600;color:var(--ink);font-family:"IBM Plex Mono",monospace;}
  .bill-flag-note{font-size:12px;color:var(--rust);margin:6px 0 0;}
  .restart-badge{font-size:11px;font-weight:600;background:var(--rust-pale);color:var(--rust);padding:3px 9px;border-radius:10px;font-family:"IBM Plex Mono",monospace;}

  .stage-nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:14px;flex-wrap:wrap;}
  .nav-btn{background:var(--card);border:1px solid var(--line-strong);color:var(--ink);padding:9px 18px;border-radius:7px;font-size:13.5px;font-weight:600;}
  .nav-btn:hover{border-color:var(--gold);color:var(--gold);}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn:disabled:hover{border-color:var(--line-strong);color:var(--ink);}
  .nav-btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;}
  .nav-btn.primary:hover{background:#a3771f;border-color:#a3771f;color:#fff;}
  .nav-btn.primary:disabled{background:#EFEBE0;border-color:var(--line-strong);color:var(--slate);}
  .nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;}
  .gate-hint{font-size:12px;color:var(--rust);max-width:280px;text-align:right;}

  @media (max-width:640px){
    .tc-row-top{flex-direction:column;align-items:flex-start;gap:8px;}
    .tc-top-right{align-self:flex-end;}
  }
  ::selection{background:var(--gold-soft);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
</style>
</head>
<body>
<div class="grain"></div>

<header class="top">
  <div class="top-row">
    <div class="brand" id="brandHome">
      <div class="mark">TN</div>
      <div>
        <div class="name" id="headerName">Tender Supply Tracker</div>
        <div class="sub" id="headerSub">Tamil Nadu Civil Supplies Corporation</div>
      </div>
    </div>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>

<div class="app-body">
  <nav class="side-nav" id="sideNav"></nav>
  <main id="app"></main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>New tender</h3>
    <div class="field"><label>Tender ID</label><input id="f-id" placeholder="TN/CS/2026/0xx"></div>
    <div class="field"><label>Commodity</label><input id="f-commodity" placeholder="e.g. Rice (PDS)"></div>
    <div class="field"><label>Region</label><input id="f-region" placeholder="e.g. Coimbatore"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelModal">Cancel</button>
      <button class="btn-gold" id="saveModal">Add tender</button>
    </div>
  </div>
</div>

<script>
/* ================= stage template (shared by every tender/spell) ================= */
const stageTemplate = [
  { phase:"Tender Analysis", title:"Tender Analysis & Eligibility Review",
    desc:"Review the notification in detail before committing to bid — this is the internal go/no-go check, and nothing here reaches TNCSC. Move to the Tender Stage once every question is answered and the analysis document is attached.",
    asQuestions:true,
    steps:[
      {t:"What are the eligibility criteria for this tender, and do we meet them?"},
      {t:"What quantity is being tendered, and can it be supplied within scope?"},
      {t:"What specifications are called for?"},
      {t:"What are the key timelines and deadlines for this tender?"},
    ],
    docs:["Tender Analysis Document"],
    note:{type:"note", text:"This tab is the gate: all four questions and the analysis document are required before you can move to the Tender Stage. Until then, you can only save and close."} },

  { phase:"Tender Stage", title:"Tender Notification & Bid Submission",
    desc:"From the notification on the government portal through to freezing and submitting the bid.",
    steps:[
      {t:"Tender notification released by TNCSC", s:"Sourced from the government tender portal."},
      {t:"Tender documentation prepared"},
      {t:"Earnest Money Deposit (EMD) submitted"},
      {t:"Technical documents uploaded to the tender portal"},
      {t:"Price bid uploaded"},
      {t:"Bid frozen & submitted before deadline"},
    ],
    docs:["EMD Receipt","Technical Bid Documents","Price Bid Document"],
    note:{type:"note", text:"Every item above is a manual submission — this stage runs as a checklist until the portal accepts it."} },

  { phase:"Bid Evaluation Stage", title:"Technical & Financial Bid Evaluation",
    desc:"TNCSC and its third-party evaluator work through capacity checks and pricing before issuing the confirmation order.",
    steps:[
      {t:"Technical bid opened by TNCSC", s:"A third party evaluates the bidder's supply capacity."},
      {t:"Technical evaluation results declared"},
      {t:"Financial bid opened", s:"Only for bidders who cleared technical evaluation."},
      {t:"Negotiations", s:"If TNCSC calls for them."},
      {t:"Confirmation Order / Letter of Acceptance issued"},
    ],
    docs:["Technical Evaluation Result","Letter of Acceptance"] },

  { phase:"Allocation Stage", title:"Region-wise Allocation",
    desc:"TNCSC issues the sub-allotment letter for the region and the award is recorded as a Sale Order in the ERP. The region-wise tonnage allocation set up here — e.g. Chennai North \u2192 Amanda Nagar, 100 tons — is the master list carried forward: the Supply, Dispatch & Delivery stage tracks deliveries against it, and the Completion Stage tracks its completion certificates against it. It isn't redefined in either place. Since the sub-allotment letter itself is issued region-wise, each region carries its own copy here rather than one shared upload.",
    steps:[
      {t:"Sub-allotment letter issued region-wise by TNCSC"},
      {t:"Recorded as a Sale Order in ERP"},
    ],
    regionAllocStage:true },

  { phase:"Security & Agreement Stage", title:"Security Deposit & Agreement Execution",
    desc:"Formalising the award with a bank guarantee and signed agreement, while the original EMD works its way back.",
    steps:[
      {t:"Security Deposit / Bank Guarantee (BG) submitted"},
      {t:"Agreement executed between supplier and TNCSC"},
      {t:"EMD refund tracked", s:"Post sub-allotment release, tender failure, or cancellation."},
    ],
    docs:["Bank Guarantee","Signed Agreement"] },

  { phase:"Supply, Dispatch & Delivery Stage", title:"Truck-wise Dispatch & Delivery Capture",
    desc:"A sub-allotment (one spell) is discharged truck by truck, not as one lump movement — a 6,000-tonne spell at ~30 tonnes a load works out to roughly 200 lorries, and one dispatch invoice equals one lorry. Every lorry is tracked here as its own record, from the moment it's dispatched from the depot to the moment it's delivered and receipted at the destination godown. The spell's tonnage is itself allocated region by region (e.g. Chennai North \u2192 Amanda Nagar) — as each region's allocated tonnage is fully delivered it ticks off and the next region becomes active, and a region-wise completion certificate is requested from ECN for it well before the spell reaches billing. The certificate itself is only confirmed as received later, in the Completion Stage.",
    steps:[
      {t:"Supply commenced as per schedule"},
      {t:"Cargo dispatched to designated depots with invoice", s:"Add each lorry below as it goes out — dispatch docs first, delivery docs once it's unloaded."},
    ],
    truckStage:true,
    dispatchDocs:["Dispatch Invoice","Packing Slip"],
    deliveryDocs:["Acknowledgement","Weighment Slip","Quality Certificate","JSN / Delivery Documentation","Stock Certificate","Delivery Invoice Receipt","Net Stock Certificate"],
    imageDocs:true,
    note:{type:"alert", text:"Billing is generated directly off each lorry's delivery documents — a missing or blurry scan on even one truck stalls that truck's line in the bill, not just the record. Once the Acknowledgement is captured, any shortage, overage, or damage against the invoiced quantity must be recorded against that lorry — it's what the region's net delivered tonnage and completion certificate request are based on."} },

  { phase:"Billing & Payment Stage", title:"Invoice Consolidation & Multi-level Audit",
    desc:"Lorry invoices don't wait for the full spell to close — with a single 30-tonne lorry of pulses worth roughly ₹36 lakh at current rates, and around 700 lorries moving in a month for one commodity, the working-capital gap is too large to fund on one final bill. Bills are raised weekly, bi-weekly, or every couple of days instead, each one consolidating whatever invoices are ready and moving independently through the audit chain before TNCSC releases funds.",
    steps:[
      {t:"Invoices consolidated into a bill for the period"},
      {t:"Bill submitted to TNCSC with supporting documents"},
    ],
    billStage:true,
    note:{type:"alert", text:"This prototype models 4 sections end to end, but a real bill can pass through 15–25 sections — each one a role-based sign-off. A single error anywhere in the chain, even a spelling mistake near the end, sends the bill all the way back to the Business Section to start over. Audits typically take 15–20 days before funds land, so that turnaround is the reason bills are staggered rather than batched."} },

  { phase:"Completion Stage", title:"Region-wise Completion Certificate",
    desc:"Once a spell's supply is fully discharged, the region-wise completion certificate requested from ECN back in the Supply stage is confirmed as received here, region by region — each with its own certificate document. This is what unlocks the two release stages that follow.",
    steps:[{t:"Apply for region-wise completion certificate"}],
    regionCertStage:true },

  { phase:"Retention Money Release", title:"5% Retention Release",
    desc:"With the completion certificate in hand, the retained 5% can be requested back.",
    steps:[{t:"Request letter submitted for release of 5% retention money"}],
    docs:["Retention Release Request Letter"] },

  { phase:"Security Deposit / BG Release", title:"Bank Guarantee Return",
    desc:"The final financial exposure on the spell — requesting the original BG or security deposit back after successful completion.",
    steps:[{t:"Request letter submitted for return of original BG / Security Deposit"}],
    docs:["BG Release Request Letter"] },

  { phase:"Tender Completion", title:"Tender Close-out",
    desc:"With supply fully discharged and all releases processed, TNCSC issues the overall tender completion certificate.",
    steps:[{t:"Tender completion certificate received from TNCSC"}],
    docs:["Tender Completion Certificate"] },
];
const STAGE_COUNT = stageTemplate.length;
const TRUCK_STAGE_INDEX = stageTemplate.findIndex(s=>s.truckStage);
const BILL_STAGE_INDEX = stageTemplate.findIndex(s=>s.billStage);

/* ================= admin-configurable master data ================= */
// Billing & Payment audit chain — editable from Admin > Section / Approval Config.
// Order matters: index 0 is where a rejected bill restarts from.
let billSectionsConfig = [
  {name:"Business Section", role:"S. Ramesh"},
  {name:"Finance Section", role:"K. Priya"},
  {name:"IT Section", role:"A. Suresh"},
  {name:"MD Section", role:"Dr. N. Elango"},
];
function billSections(){
  return billSectionsConfig;
}

// Master list of regions/godowns TNCSC operates across — editable from Admin > Region Config.
// This is what populates the region picker when a tender allocates tonnage in the Allocation Stage.
let regionMasterConfig = [
  "Chennai North — Amanda Nagar",
  "Chennai South — Pusaripalayam",
  "Trichy Town",
  "Madurai East",
  "Tirunelveli Rural",
  "Salem Town",
  "Coimbatore North",
];

/* ================= seed data ================= */
function makeProgress(currentIndex, checkedStages, docStages){
  const checks = {}; const docs = {}; const answers = {};
  checkedStages.forEach(si=>{
    const s = stageTemplate[si];
    if(s.asQuestions){ s.steps.forEach((_,j)=> answers[si+"-"+j] = "Reviewed and confirmed — no blockers identified."); }
    else { s.steps.forEach((_,j)=> checks[si+"-"+j]=1); }
  });
  docStages.forEach(si=>{ (stageTemplate[si].docs||[]).forEach((_,j)=> docs[si+"-"+j]={name:"scan_"+(si+1)+"_"+(j+1)+".pdf"} ); });
  return { currentIndex, checks, docs, answers };
}
function seq(n){ return Array.from({length:n}, (_,i)=>i); }

// completeCount lorries get every dispatch+delivery doc filled; remainder (up to total) get dispatch docs only (in transit)
// regionPlan (optional) assigns lorries to regions round-robin: [{region: idx, tons: n}, ...] or a flat tons number applied to all
function makeTrucks(total, completeCount, regionPlan, depot){
  const st = stageTemplate[TRUCK_STAGE_INDEX];
  return Array.from({length:total}, (_,i)=>{
    const dispatchDocs = {}; st.dispatchDocs.forEach((_,j)=> dispatchDocs[j] = {name:"lorry"+(i+1)+"_dispatch_"+(j+1)+".pdf"});
    const deliveryDocs = {};
    if(i < completeCount){ st.deliveryDocs.forEach((_,j)=> deliveryDocs[j] = {name:"lorry"+(i+1)+"_delivery_"+(j+1)+".jpg"}); }
    const plan = regionPlan ? regionPlan[i % regionPlan.length] : null;
    return {
      id:"LRY-"+String(i+1).padStart(3,'0'), dispatchDocs, deliveryDocs,
      region: plan ? plan.region : null,
      tons: plan ? plan.tons : 30,
      variance: i < completeCount ? { type:"none", qty:0, notes:"" } : null,
      vehicleNo: "TN "+(29+(i%9))+" "+String.fromCharCode(65+(i%5))+String.fromCharCode(66+(i%4))+" "+(1000+i*137)%9999,
      driverName: "", driverPhone: "",
      source: depot || "", destination: "",
      dispatchDate: "",
    };
  });
}

// Region-wise allocation for a spell, e.g. makeRegions([{name:"Chennai North \u2014 Amanda Nagar", tons:100}, ...])
function makeRegions(specs){
  return specs.map(r=>({ name:r.name, allocatedTons:r.tons, subAllotmentDoc:null, cert:{status:"pending", doc:null} }));
}

// clearedCount bills fully pass all sections; if partialSection is set, one extra bill sits mid-chain at that section index;
// rejectedDemo adds one more bill that was sent back by a section and needs the invoice document resubmitted;
// defaultRegions (array of region indices) is applied to every generated bill as the region(s) it covers
function makeBills(clearedCount, partialSection, rejectedDemo, defaultRegions){
  const sections = billSections();
  const sampleComments = [
    "Verified against dispatch invoices and weighment slips — figures tally.",
    "Funds availability confirmed, ledger entries reconciled.",
    "System validation passed — no duplicate or mismatched entries.",
    "Reviewed and signed off for release.",
  ];
  const bills = Array.from({length:clearedCount}, (_,i)=>({
    id:"BILL-"+String(i+1).padStart(3,'0'), period:"Week "+(i+1), value:"₹"+(28+i*4)+"." + (i%2===0?"6":"2") +"L",
    doc:{name:"bill_"+(i+1)+"_invoice.pdf"}, passUpto: sections.length, restartCount:0, rejection:null,
    regions: defaultRegions ? [...defaultRegions] : [],
    approvals: sections.map((sec,si)=>({ sectionIdx:si, sectionName:sec.name, role:sec.role, comment: sampleComments[si % sampleComments.length] }))
  }));
  if(typeof partialSection === "number"){
    bills.push({ id:"BILL-"+String(clearedCount+1).padStart(3,'0'), period:"Week "+(clearedCount+1), value:"₹31.4L",
      doc:{name:"bill_"+(clearedCount+1)+"_invoice.pdf"}, passUpto: partialSection, restartCount:0, rejection:null,
      regions: defaultRegions ? [...defaultRegions] : [],
      approvals: sections.slice(0, partialSection).map((sec,si)=>({ sectionIdx:si, sectionName:sec.name, role:sec.role, comment: sampleComments[si % sampleComments.length] })) });
  }
  if(rejectedDemo){
    const n = bills.length+1;
    bills.push({ id:"BILL-"+String(n).padStart(3,'0'), period:"Week "+n, value:"₹29.8L",
      doc:null, passUpto:0, restartCount:1,
      rejection:{ sectionIdx:1, sectionName:sections[1].name, reason:"Bill value doesn't tally with the dispatch invoice totals for this period — please recheck the lorry-wise figures and resubmit." },
      regions: defaultRegions ? [...defaultRegions] : [], approvals:[] });
  }
  return bills;
}

/* ================= render: analytics ================= */
function renderAnalytics(){
  const parseCr = (v)=>{ const m = v.match(/₹([\d.]+)Cr/); return m ? parseFloat(m[1]) : 0; };
  const totalValue = tenders.reduce((s,t)=> s+parseCr(t.value), 0);
  const activeCount = tenders.filter(t=>t.status==="Active").length;
  const completedCount = tenders.filter(t=>t.status==="Completed").length;
  const avgProgress = tenders.length ? Math.round(tenders.reduce((a,t)=>a+tenderProgress(t),0)/tenders.length) : 0;

  const allRegions = tenders.flatMap(t=>t.regions||[]);
  const certCounts = { pending:0, requested:0, received:0 };
  allRegions.forEach(r=> certCounts[r.cert.status]++);

  const sections = billSections();
  const allBills = tenders.flatMap(t=>t.bills||[]);
  const billRejected = allBills.filter(b=> b.rejection).length;

  const donutGradient = (parts)=>{ // parts: [{value,color}]
    const total = Math.max(1, parts.reduce((s,p)=>s+p.value,0));
    let acc = 0;
    return parts.map(p=>{
      const start = acc/total*360; acc += p.value;
      const end = acc/total*360;
      return `${p.color} ${start}deg ${end}deg`;
    }).join(", ");
  };
  const certGradient = donutGradient([
    { value:certCounts.received, color:"var(--green)" },
    { value:certCounts.requested, color:"var(--gold)" },
    { value:certCounts.pending, color:"var(--slate)" },
  ]);

  // Quote amount — each tender's quoted/awarded value, largest first
  const quoteRows = tenders.map(t=>({ label:`${t.commodity} · ${t.id}`, value:parseCr(t.value) })).sort((a,b)=>b.value-a.value);
  const maxQuote = Math.max(1, ...quoteRows.map(r=>r.value));

  // Month vs quote — total quoted value per month, in chronological order
  const monthMap = {};
  tenders.forEach(t=>{
    const d = new Date(t.notified);
    const key = isNaN(d) ? "Unknown" : d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
    monthMap[key] = (monthMap[key]||0) + parseCr(t.value);
  });
  const monthEntries = Object.entries(monthMap).sort((a,b)=> new Date("01 "+a[0]) - new Date("01 "+b[0]));
  const maxMonth = Math.max(1, ...monthEntries.map(e=>e[1]));

  document.getElementById("app").innerHTML = `
    <div class="analytics-grid">
      <div class="kpi-tile"><div class="kn">${tenders.length}</div><div class="kl">Total tenders</div></div>
      <div class="kpi-tile"><div class="kn">${activeCount}</div><div class="kl">Active tenders</div><div class="kd up">${completedCount} completed</div></div>
      <div class="kpi-tile"><div class="kn">₹${totalValue.toFixed(1)}Cr</div><div class="kl">Total quote value</div></div>
      <div class="kpi-tile"><div class="kn">${avgProgress}%</div><div class="kl">Average progress</div></div>
      <div class="kpi-tile"><div class="kn">${allBills.length}</div><div class="kl">Bills raised</div><div class="kd ${billRejected?'warn':'up'}">${billRejected} rejected, resubmitting</div></div>
    </div>

    <div class="chart-row">
      <div class="chart-card">
        <h3>Region-wise completion certificates</h3>
        <div class="chart-sub">Status across every region in every tender</div>
        <div class="donut-wrap">
          <div class="donut" style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${certGradient});flex:none;"></div>
          <div class="donut-legend">
            <div class="li"><span class="sw" style="background:var(--green);"></span>Received — ${certCounts.received}</div>
            <div class="li"><span class="sw" style="background:var(--gold);"></span>Requested — ${certCounts.requested}</div>
            <div class="li"><span class="sw" style="background:var(--slate);"></span>Not yet requested — ${certCounts.pending}</div>
          </div>
        </div>
      </div>
      <div class="chart-card">
        <h3>Quote amount</h3>
        <div class="chart-sub">Quoted value by tender, largest first</div>
        ${quoteRows.map(r=>{
          const pct = Math.round(r.value/maxQuote*100);
          return `<div class="bar-row"><div class="blbl" title="${r.label}">${r.label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">₹${r.value.toFixed(1)}Cr</div></div>`;
        }).join("") || `<div class="qa-item">No tenders yet.</div>`}
      </div>
    </div>

    <div class="chart-row">
      <div class="chart-card" style="grid-column:1/-1;">
        <h3>Month vs quote</h3>
        <div class="chart-sub">Total quoted value by the month a tender was notified</div>
        ${monthEntries.map(([month,val])=>{
          const pct = Math.round(val/maxMonth*100);
          return `<div class="bar-row"><div class="blbl" title="${month}">${month}</div><div class="bar-track"><div class="bar-fill green" style="width:${pct}%"></div></div><div class="bar-val">₹${val.toFixed(1)}Cr</div></div>`;
        }).join("") || `<div class="qa-item">No tenders yet.</div>`}
      </div>
    </div>
  `;
}

// Keeps every tender's in-progress bills from pointing past the end of the chain after Admin reorders/removes a section
function clampBillProgressToSections(){
  const len = billSectionsConfig.length;
  tenders.forEach(t=> (t.bills||[]).forEach(b=>{ b.passUpto = Math.min(b.passUpto, len); }));
}

/* ================= render: tender detail ================= */
function stageStatus(i){
  const t = getTender();
  if(i < t.currentIndex) return "done";
  if(i === t.currentIndex) return "current";
  return "pending";
}
function truckComplete(st, truck){
  return st.dispatchDocs.every((_,j)=> truck.dispatchDocs[j]) && st.deliveryDocs.every((_,j)=> truck.deliveryDocs[j]);
}
// Rounds a tonnage figure to 3 decimals (kg-level precision) so bag/box math doesn't show float noise
function round3(n){ return Math.round((Number(n)||0)*1000)/1000; }
// Net tonnage a delivered lorry actually counts toward its region, after any recorded shortage/overage/damage
function truckNetTons(tr){
  const base = Number(tr.tons)||0;
  if(!tr.variance || tr.variance.type==="none") return base;
  const qty = Number(tr.variance.qty)||0;
  if(tr.variance.type==="overage") return base + qty;
  return Math.max(0, base - qty); // shortage or damage both reduce what's counted as delivered
}
function regionDeliveredTons(t, ri){
  const st = stageTemplate[TRUCK_STAGE_INDEX];
  return t.trucks.filter(tr=> tr.region===ri && truckComplete(st, tr)).reduce((sum,tr)=> sum + truckNetTons(tr), 0);
}
function regionAllocatedTons(t, ri){ return t.regions[ri].allocatedTons; }
function regionFullySupplied(t, ri){ return regionDeliveredTons(t, ri) >= regionAllocatedTons(t, ri); }
// The "active" region is the first one not yet fully supplied — everything before it should already be ticked off
function activeRegionIndex(t){
  const idx = t.regions.findIndex(( _, ri)=> !regionFullySupplied(t, ri));
  return idx === -1 ? t.regions.length-1 : idx;
}
function stageComplete(t, i){
  const st = stageTemplate[i];
  const stepsOk = st.asQuestions
    ? st.steps.every((_,j)=> (t.answers[i+"-"+j]||"").trim().length>0)
    : st.steps.every((_,j)=> t.checks[i+"-"+j]);
  const docsOk = !st.docs || st.docs.length===0 || st.docs.every((_,j)=> t.docs[i+"-"+j]);
  const trucksOk = !st.truckStage || (t.trucks.length>0 && t.trucks.every(tr=> truckComplete(st, tr)));
  // Supply stage: every region must be fully delivered and have at least *requested* its completion certificate from ECN
  const regionsOk = !st.truckStage || (t.regions && t.regions.length>0 && t.regions.every((_,ri)=> regionFullySupplied(t,ri) && t.regions[ri].cert.status!=="pending"));
  // Completion stage: the certificate requested back in Supply must now actually be *received* for every region
  const certReceivedOk = !st.regionCertStage || (t.regions && t.regions.length>0 && t.regions.every(r=> r.cert.status==="received" && r.cert.doc));
  const regionAllocOk = !st.regionAllocStage || (t.regions && t.regions.length>0 && t.regions.every(r=> (r.allocatedTons||0)>0 && r.subAllotmentDoc));
  const billsOk = !st.billStage || (t.bills.length>0 && t.bills.every(b=> b.passUpto >= billSections().length));
  return stepsOk && docsOk && trucksOk && regionsOk && certReceivedOk && regionAllocOk && billsOk;
}

  document.getElementById("app").innerHTML = `

      </div>
    </div>

    </div>
    <main class="stage-content" id="stageDetail"></main>
  `;
  renderProgressStrip();

function renderProgressStrip(){
  const t = getTender();
  const pct = Math.round((Math.min(t.currentIndex,STAGE_COUNT)/STAGE_COUNT)*100);
  document.getElementById("progressStrip").innerHTML = `
    <div class="ptext"><b>${t.id}</b> — stage ${Math.min(t.currentIndex+1,STAGE_COUNT)} of ${STAGE_COUNT}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="pct">${pct}%</div>
  `;
}

function renderStepper(){
  const el = document.getElementById("stepper");
  el.innerHTML = stageTemplate.map((st,i)=>{
    const status = stageStatus(i);
    const tag = status==="done" ? "cleared" : status==="current" ? "in progress" : "pending";
    return `
    <div class="step ${status} ${selectedStage===i?'selected':''}" data-idx="${i}" title="${st.title}">
      <div class="dot">${status==='done'?'✓':String(i+1).padStart(2,'0')}</div>
      <div class="body">
        <div class="phase">${st.phase}</div>
        <span class="status-tag">${tag}</span>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".step").forEach(n=> n.onclick = ()=>{ selectedStage=parseInt(n.dataset.idx); renderStepperAndDetail(true); window.scrollTo({top:0, behavior:"smooth"}); });
}
// Pass scrollTab=true only when the user is actually switching stages (tab click, prev/next stage buttons).
// Field edits within a stage (checkboxes, uploads, region/lorry inputs, etc.) re-render without touching scroll position.
function renderStepperAndDetail(scrollTab){
  renderStepper();
  renderStageDetail();
  renderProgressStrip();
  if(scrollTab){
    const sel = document.querySelector("#stepper .step.selected");
    if(sel) sel.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  }
}

            </div>
          </div>` : ""}

          <div class="region-cert-row">
            ${certStatus==="received" ? `<span class="region-cert-status">Received — this region is cleared for the release stages that follow.</span>` :
              certStatus==="requested" ? (hasCertDoc
                ? `<button class="cert-btn recv" data-recvcert="${ri}">Mark certificate received</button>`
                : `<span class="region-cert-status">Upload the certificate document above before marking it received.</span>`) :
              `<span class="region-cert-status">Not yet requested — go back to the Supply, Dispatch &amp; Delivery stage once this region's allocation is fully delivered, and request it from there.</span>`}
          </div>
        </div>`;
      }).join("") || `<div class="qa-item">No regions were set up for this spell — set the region-wise tonnage allocation in the Allocation Stage first.</div>`}
    </div>`;
  }

  let allocHtml = "";
  if(st.regionAllocStage){
    const regions = t.regions || [];
    allocHtml = `
    <div class="section-lbl">Region-wise tonnage allocation</div>
    <div class="region-add-row">
      <input class="rname" id="newRegionName" list="regionMasterList" placeholder="Pick a region, e.g. Chennai North — Amanda Nagar">
      <datalist id="regionMasterList">
        ${regionMasterConfig.map(name=>`<option value="${name}">`).join("")}
      </datalist>
      <input class="rtons" id="newRegionTons" type="number" min="0" placeholder="Tons e.g. 100">
      <button id="addRegionBtn">+ Add region allocation</button>
    </div>
    <div class="region-add-hint">Suggestions come from the region master list in <b>Admin \u2192 Region Config</b> — you can still type a name that isn't in the list if this spell needs one.</div>
    <div class="region-list">
      ${regions.map((r,ri)=>{
        const hasSubDoc = !!r.subAllotmentDoc;
        const subDocKey = "subdoc-"+ri;
        return `<div class="region-card">
          <div class="region-head">
            <input class="rname-edit" data-region-name="${ri}" value="${r.name}">
            <button class="rm-region" data-rmregion="${ri}">Remove</button>
          </div>
          <div class="region-tons-row">
            <span>Allocated</span>
            <input class="rtons-edit" type="number" min="0" data-region-tons="${ri}" value="${r.allocatedTons||0}">
            <span>tons</span>
          </div>
          <div class="bill-doc-row">
            <div class="bill-doc-tile ${hasSubDoc?'uploaded':''}">
              <div class="dname">Sub-allotment Letter — ${r.name}</div>
              <div class="dstatus">${hasSubDoc?r.subAllotmentDoc.name:'Not uploaded'}</div>
              <input type="file" accept="application/pdf,image/*" style="display:none" id="file-${subDocKey}" data-suballotdoc="${ri}">
              <button class="cap-btn" data-suballottrigger="${subDocKey}">${hasSubDoc?'Replace':'Upload'}</button>
            </div>
          </div>
        </div>`;
      }).join("") || `<div class="qa-item">No regions added yet — add each region this spell covers and its tonnage above (e.g. Chennai North — Amanda Nagar, 100 tons), then attach that region's sub-allotment letter. This list carries through to the Supply and Completion stages, so it only needs setting up once.</div>`}
    </div>`;
  }

  const checklistHtml = st.asQuestions ? `
      <div class="section-lbl">Review questions</div>
      <div class="qa-list">
        ${st.steps.map((step,j)=>{
          const val = t.answers[i+"-"+j] || "";
          return `<div class="qa-item ${val.trim()?'answered':''}">
            <label class="qa-label">${step.t}</label>
            ${step.s?`<div class="ci-sub">${step.s}</div>`:""}
            <textarea class="qa-input" data-ans="${j}" rows="2" placeholder="Type the answer here…">${val}</textarea>
          </div>`;
        }).join("")}
      </div>` : `
      <div class="section-lbl">Checklist</div>
      <div class="checklist">
        ${st.steps.map((step,j)=>{
          const checked = !!t.checks[i+"-"+j];
          return `<label class="check-item ${checked?'checked':''}">
            <input type="checkbox" data-chk="${j}" ${checked?'checked':''}>
            <div style="flex:1;">
              <div class="ci-text">${step.t}</div>
              ${step.s?`<div class="ci-sub">${step.s}</div>`:""}
            </div>
          </label>`;
        }).join("")}
      </div>`;

  el.innerHTML = `
    <div class="card">
      <div class="detail-head">
        <div>
          <div class="eyebrow">Stage ${String(i+1).padStart(2,'0')} of ${STAGE_COUNT} · ${st.phase}</div>
          <h2>${st.title}</h2>
        </div>
        <span class="stage-status-pill ${status}">${status==='done'?'Cleared':status==='current'?'In progress':'Pending'}</span>
      </div>
      <p class="detail-desc">${st.desc}</p>
      ${st.note ? `<div class="note ${st.note.type==='alert'?'alert':''}">${st.note.text}</div>` : ""}

      ${checklistHtml}

      ${auditHtml}
      ${docsHtml}
      ${truckHtml}
      ${certHtml}
      ${allocHtml}

      <div class="stage-nav-btns">
        <button class="nav-btn" id="prevStageBtn" ${i===0?'disabled':''}>&larr; Previous stage</button>
        <div class="nav-right">
          <span class="gate-hint" style="${complete?'display:none':''}">Complete the ${st.asQuestions?'questions':'checklist'}${docNames.length?' and attach the required documents':''}${st.truckStage?' and finish every lorry\u2019s dispatch and delivery documents, then request the completion certificate for every region':''}${st.billStage?' and get every bill you\u2019ve raised approved through all sections':''}${st.regionCertStage?' and mark every region\u2019s completion certificate as received':''}${st.regionAllocStage?' and set up the region-wise tonnage allocation with each region\u2019s sub-allotment letter':''} to continue.</span>
          <button class="nav-btn" id="saveDraftBtn">Save as Draft</button>
          <button class="nav-btn primary" id="saveNextBtn" ${complete?'':'disabled'}>${nextLabel}</button>
        </div>
      </div>
    </div>
  `;

  el.querySelectorAll("[data-chk]").forEach(box=>{
    box.onchange = (e)=>{
      const j = e.target.dataset.chk;
      t.checks[i+"-"+j] = e.target.checked ? 1 : 0;
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-ans]").forEach(ta=>{
    ta.oninput = (e)=>{
      const j = e.target.dataset.ans;
      t.answers[i+"-"+j] = e.target.value;
      const nowComplete = stageComplete(t,i);
      const btn = document.getElementById("saveNextBtn");
      const hint = el.querySelector(".gate-hint");
      if(btn) btn.disabled = !nowComplete;
      if(hint) hint.style.display = nowComplete ? "none" : "";
      e.target.closest(".qa-item").classList.toggle("answered", e.target.value.trim().length>0);
    };
  });
  el.querySelectorAll("[data-trigger]").forEach(btn=>{
    btn.onclick = ()=> document.getElementById("file-"+btn.dataset.trigger).click();
  });
  el.querySelectorAll("input[type=file][data-key]").forEach(inp=>{
    inp.onchange = (e)=>{
      const key = e.target.dataset.key;
      const file = e.target.files[0];
      if(file){ t.docs[key] = { name:file.name }; renderStepperAndDetail(); }
    };
  });
  el.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); delete t.docs[btn.dataset.remove]; renderStepperAndDetail(); };
  });

  /* ---- region-wise allocation handlers ---- */
  const addRegionBtn = document.getElementById("addRegionBtn");
  if(addRegionBtn){
    addRegionBtn.onclick = ()=>{
      const nameInp = document.getElementById("newRegionName");
      const tonsInp = document.getElementById("newRegionTons");
      const name = nameInp.value.trim() || "Region "+((t.regions||[]).length+1);
      const tons = Math.max(0, parseFloat(tonsInp.value)||0);
      if(!t.regions) t.regions = [];
      t.regions.push({ name, allocatedTons: tons, cert:{status:"pending"} });
      renderStepperAndDetail();
    };
  }
  el.querySelectorAll("[data-region-name]").forEach(inp=>{
    inp.onchange = (e)=>{ t.regions[parseInt(e.target.dataset.regionName)].name = e.target.value.trim() || "Region"; renderStepperAndDetail(); };
  });
  el.querySelectorAll("[data-region-tons]").forEach(inp=>{
    inp.onchange = (e)=>{ t.regions[parseInt(e.target.dataset.regionTons)].allocatedTons = Math.max(0, parseFloat(e.target.value)||0); renderStepperAndDetail(); };
  });
  el.querySelectorAll("[data-rmregion]").forEach(btn=>{
    btn.onclick = ()=>{
      const ri = parseInt(btn.dataset.rmregion);
      t.regions.splice(ri,1);
      // unassign any lorries that pointed at this region / shift indices down for lorries pointing past it
      t.trucks.forEach(tr=>{
        if(tr.region===ri) tr.region = null;
        else if(tr.region!==null && tr.region>ri) tr.region -= 1;
      });
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-reqcert]").forEach(btn=>{
    // Request the region-wise completion certificate from ECN — only enabled once the region's full allocation is delivered
    btn.onclick = ()=>{ t.regions[parseInt(btn.dataset.reqcert)].cert.status = "requested"; renderStepperAndDetail(); };
  });
  el.querySelectorAll("[data-suballottrigger]").forEach(btn=>{
    btn.onclick = ()=> document.getElementById("file-"+btn.dataset.suballottrigger).click();
  });
  el.querySelectorAll("input[type=file][data-suballotdoc]").forEach(inp=>{
    inp.onchange = (e)=>{
      const ri = parseInt(e.target.dataset.suballotdoc);
      const file = e.target.files[0];
      if(file){ t.regions[ri].subAllotmentDoc = { name:file.name }; renderStepperAndDetail(); }
    };
  });
  el.querySelectorAll("[data-certtrigger]").forEach(btn=>{
    btn.onclick = ()=> document.getElementById("file-"+btn.dataset.certtrigger).click();
  });
  el.querySelectorAll("input[type=file][data-certdoc]").forEach(inp=>{
    inp.onchange = (e)=>{
      const ri = parseInt(e.target.dataset.certdoc);
      const file = e.target.files[0];
      if(file){ t.regions[ri].cert.doc = { name:file.name }; renderStepperAndDetail(); }
    };
  });
  el.querySelectorAll("[data-recvcert]").forEach(btn=>{
    // Completion Stage: confirms ECN's response has landed — the certificate is now formally in hand for this region
    btn.onclick = ()=>{ t.regions[parseInt(btn.dataset.recvcert)].cert.status = "received"; renderStepperAndDetail(); };
  });

  /* ---- truck (lorry) registry handlers ---- */
  const addTruckBtn = document.getElementById("addTruckBtn");
  if(addTruckBtn){
    addTruckBtn.onclick = ()=>{
      t.trucks.push({ id:"LRY-"+String(t.trucks.length+1).padStart(3,'0'), dispatchDocs:{}, deliveryDocs:{}, region:null, tons:30, packMode:"loose", unitWeightKg:null, unitCount:null, variance:null, vehicleNo:"", driverName:"", driverPhone:"", source:"", destination:"", dispatchDate:"" });
      openTruckIdx = t.trucks.length-1;
      renderStepperAndDetail();
    };
  }
  el.querySelectorAll("[data-toggle]").forEach(head=>{
    head.onclick = ()=>{
      const ti = parseInt(head.dataset.toggle);
      openTruckIdx = openTruckIdx===ti ? null : ti;
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-rmtruck]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      t.trucks.splice(parseInt(btn.dataset.rmtruck),1);
      openTruckIdx = null;
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-trucktrigger]").forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); document.getElementById("file-"+btn.dataset.trucktrigger).click(); };
  });
  el.querySelectorAll("input[type=file][data-truckfile]").forEach(inp=>{
    inp.onchange = (e)=>{
      const [ti, kind, j] = e.target.dataset.truckfile.split("|");
      const file = e.target.files[0];
      if(file){
        const truck = t.trucks[parseInt(ti)];
        (kind==="dispatch" ? truck.dispatchDocs : truck.deliveryDocs)[j] = { name:file.name };
        // Acknowledgement is deliveryDocs[0] — the moment it lands, open up shortage/overage/damage capture automatically
        if(kind==="delivery" && j==="0" && !truck.variance){ truck.variance = { type:"none", qty:0, notes:"" }; }
        renderStepperAndDetail();
      }
    };
  });

  el.querySelectorAll("[data-truckfield]").forEach(inp=>{
    inp.onchange = (e)=>{
      const [ti, field] = e.target.dataset.truckfield.split("|");
      t.trucks[parseInt(ti)][field] = e.target.value;
    };
  });
  el.querySelectorAll("[data-truckregion]").forEach(sel=>{
    sel.onchange = (e)=>{
      const ti = parseInt(e.target.dataset.truckregion);
      t.trucks[ti].region = e.target.value===""? null : parseInt(e.target.value);
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-truckton]").forEach(inp=>{
    inp.onchange = (e)=>{
      const ti = parseInt(e.target.dataset.truckton);
      t.trucks[ti].tons = Math.max(0, parseFloat(e.target.value)||0);
      renderStepperAndDetail();
    };
  });
  // Packing mode: loose (tonnage typed directly) vs box/bag (tonnage derived from unit weight x count)
  el.querySelectorAll("[data-truckpack]").forEach(sel=>{
    sel.onchange = (e)=>{
      const ti = parseInt(e.target.dataset.truckpack);
      const truck = t.trucks[ti];
      truck.packMode = e.target.value;
      if(truck.packMode === "unit"){
        truck.tons = round3(((Number(truck.unitWeightKg)||0) * (Number(truck.unitCount)||0)) / 1000);
      }
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-truckunitweight]").forEach(inp=>{
    inp.onchange = (e)=>{
      const ti = parseInt(e.target.dataset.truckunitweight);
      const truck = t.trucks[ti];
      truck.unitWeightKg = Math.max(0, parseFloat(e.target.value)||0);
      truck.tons = round3((truck.unitWeightKg * (Number(truck.unitCount)||0)) / 1000);
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-truckunitcount]").forEach(inp=>{
    inp.onchange = (e)=>{
      const ti = parseInt(e.target.dataset.truckunitcount);
      const truck = t.trucks[ti];
      truck.unitCount = Math.max(0, parseFloat(e.target.value)||0);
      truck.tons = round3(((Number(truck.unitWeightKg)||0) * truck.unitCount) / 1000);
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-vartype]").forEach(sel=>{
    sel.onchange = (e)=>{
      const ti = parseInt(e.target.dataset.vartype);
      const truck = t.trucks[ti];
      if(!truck.variance) truck.variance = { type:"none", qty:0, notes:"" };
      truck.variance.type = e.target.value;
      if(e.target.value==="none"){ truck.variance.qty = 0; }
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-varqty]").forEach(inp=>{
    inp.oninput = (e)=>{
      const ti = parseInt(e.target.dataset.varqty);
      const truck = t.trucks[ti];
      if(!truck.variance) truck.variance = { type:"none", qty:0, notes:"" };
      truck.variance.qty = Math.max(0, parseFloat(e.target.value)||0);
      // update just the region delivered-tons figures without a full re-render / losing focus
      const regionCard = el.querySelectorAll(".region-card")[truck.region];
      if(regionCard){
        const netEl = regionCard.querySelector(".region-tons-row b");
        const track = regionCard.querySelector(".region-fill");
        if(netEl && truck.region!==null){
          const delivered = regionDeliveredTons(t, truck.region);
          netEl.textContent = delivered;
          if(track){ const alloc = t.regions[truck.region].allocatedTons||0; track.style.width = (alloc>0?Math.min(100,Math.round(delivered/alloc*100)):0)+"%"; }
        }
      }
    };
    inp.onchange = ()=> renderStepperAndDetail();
  });
  el.querySelectorAll("[data-varnotes]").forEach(ta=>{
    ta.oninput = (e)=>{
      const ti = parseInt(e.target.dataset.varnotes);
      const truck = t.trucks[ti];
      if(!truck.variance) truck.variance = { type:"none", qty:0, notes:"" };
      truck.variance.notes = e.target.value;
    };
  });

  /* ---- bill (billing & payment) handlers ---- */
  const addBillBtn = document.getElementById("addBillBtn");
  if(addBillBtn){
    addBillBtn.onclick = ()=>{
      t.bills.push({ id:"BILL-"+String(t.bills.length+1).padStart(3,'0'), period:"Week "+(t.bills.length+1), value:"₹—", doc:null, passUpto:0, restartCount:0, rejection:null, regions:[], approvals:[] });
      renderStepperAndDetail();
    };
  }
  el.querySelectorAll("[data-billregion]").forEach(cb=>{
    cb.onchange = (e)=>{
      const [bi, ri] = e.target.dataset.billregion.split("|").map(Number);
      const bill = t.bills[bi];
      if(!bill.regions) bill.regions = [];
      if(e.target.checked){ if(!bill.regions.includes(ri)) bill.regions.push(ri); }
      else { bill.regions = bill.regions.filter(x=>x!==ri); }
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-billtrigger]").forEach(btn=>{
    btn.onclick = ()=> document.getElementById("file-"+btn.dataset.billtrigger).click();
  });
  el.querySelectorAll("input[type=file][data-billdoc]").forEach(inp=>{
    inp.onchange = (e)=>{
      const bi = parseInt(e.target.dataset.billdoc);
      const file = e.target.files[0];
      if(file){
        const bill = t.bills[bi];
        bill.doc = { name:file.name };
        // resubmitting after a rejection clears the rejection banner and re-arms the audit chain from the top
        bill.rejection = null;
        renderStepperAndDetail();
      }
    };
  });
  el.querySelectorAll("textarea[id^='approveComment-']").forEach(ta=>{
    // Approve button stays disabled until the approver has actually written a comment
    const bi = ta.id.split("-")[1];
    const btn = document.getElementById("approveBtn-"+bi);
    const sync = ()=>{ if(btn) btn.disabled = ta.value.trim().length===0; };
    sync();
    ta.oninput = sync;
  });
  el.querySelectorAll("[data-approvebill]").forEach(btn=>{
    btn.onclick = ()=>{
      const bi = parseInt(btn.dataset.approvebill);
      const bill = t.bills[bi];
      const sections = billSections();
      const commentInp = document.getElementById("approveComment-"+bi);
      const comment = commentInp ? commentInp.value.trim() : "";
      if(!comment) return; // guarded by disabled state too, but double-check
      if(!bill.approvals) bill.approvals = [];
      bill.approvals.push({ sectionIdx: bill.passUpto, sectionName: sections[bill.passUpto].name, role: sections[bill.passUpto].role, comment });
      bill.passUpto = Math.min(bill.passUpto+1, sections.length);
      renderStepperAndDetail();
    };
  });
  el.querySelectorAll("[data-openreject]").forEach(btn=>{
    btn.onclick = ()=>{ openRejectBillIdx = parseInt(btn.dataset.openreject); renderStepperAndDetail(); };
  });
  el.querySelectorAll("[data-cancelreject]").forEach(btn=>{
    btn.onclick = ()=>{ openRejectBillIdx = null; renderStepperAndDetail(); };
  });
  el.querySelectorAll("[data-confirmreject]").forEach(btn=>{
    btn.onclick = ()=>{
      const bi = parseInt(btn.dataset.confirmreject);
      const bill = t.bills[bi];
      const sections = billSections();
      const reasonInp = document.getElementById("rejectReason-"+bi);
      const reason = (reasonInp && reasonInp.value.trim()) || "No reason given.";
      bill.rejection = { sectionIdx: bill.passUpto, sectionName: sections[bill.passUpto].name, reason };
      bill.passUpto = 0;
      bill.doc = null; // sent back to the bidder — the bill document has to be corrected and resubmitted
      bill.approvals = []; // audit restarts from Business Section, so prior sign-offs no longer apply
      bill.restartCount = (bill.restartCount||0) + 1;
      openRejectBillIdx = null;
      renderStepperAndDetail();
    };
  });

  const prevStage = document.getElementById("prevStageBtn");
  if(prevStage){
    prevStage.onclick = ()=>{
      if(i>0){ selectedStage = i-1; renderTenderDetail(); window.scrollTo({top:0, behavior:"smooth"}); }
    };
  }
  const saveDraft = document.getElementById("saveDraftBtn");
  if(saveDraft){
    saveDraft.onclick = ()=>{
      const original = saveDraft.textContent;
      saveDraft.textContent = "Draft saved ✓";
      saveDraft.disabled = true;
      setTimeout(()=>{ saveDraft.textContent = original; saveDraft.disabled = false; }, 1200);
    };
  }
  const saveNext = document.getElementById("saveNextBtn");
  if(saveNext){
    saveNext.onclick = ()=>{
      if(!stageComplete(t,i)) return;
      if(isLast){ t.status="Completed"; goDashboard(); return; }
      t.currentIndex = Math.max(t.currentIndex, i+1);
      selectedStage = i+1;
      renderTenderDetail();
      window.scrollTo({top:0, behavior:"smooth"});
    };
  }
}

/* ================= main render dispatch ================= */
function render(){
  renderHeader();
  renderSideNav();
  if(view==="dashboard") renderDashboard();
  else if(view==="analytics") renderAnalytics();
  else if(view==="admin") renderAdmin();
  else renderTenderDetail();
  syncHeaderHeight();
}
render();
</script>
</body>
</html>
